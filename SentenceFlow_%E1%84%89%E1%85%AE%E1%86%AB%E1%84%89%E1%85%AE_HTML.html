<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f46e5">
  <title>SentenceFlow | 영어 문장 학습</title>
  <style>
    :root{--primary:#4f46e5;--primary-dark:#4338ca;--ink:#172033;--muted:#64748b;--line:#e2e8f0;--bg:#f6f7fb;--white:#fff;--green:#059669;--red:#e11d48;--amber:#d97706}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.55}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #a5b4fc;outline-offset:2px}
    .topbar{position:sticky;top:0;z-index:5;background:#ffffffed;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.top-inner{max-width:1100px;margin:auto;padding:14px 22px;display:flex;align-items:center;gap:20px;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:21px;white-space:nowrap}.logo{display:grid;place-items:center;width:38px;height:38px;background:linear-gradient(135deg,#6366f1,#4338ca);color:#fff;border-radius:13px;box-shadow:0 6px 16px #4f46e533}.nav{display:flex;gap:5px;flex-wrap:wrap}.nav button{background:transparent;color:var(--muted);padding:9px 12px;border-radius:11px;font-weight:700}.nav button.active,.nav button:hover{background:#eef2ff;color:var(--primary)}.container{max-width:1100px;margin:0 auto;padding:30px 22px 100px}.hero{padding:28px;border-radius:24px;color:#fff;background:linear-gradient(120deg,#3730a3,#6366f1 65%,#818cf8);box-shadow:0 15px 35px #4338ca24;display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.hero h1{margin:0 0 8px;font-size:clamp(25px,4vw,35px);line-height:1.2}.hero p{margin:0;color:#e0e7ff}.hero .hero-mark{font-size:64px;opacity:.9}.btn{padding:10px 15px;border-radius:12px;font-weight:800;transition:.15s}.btn-primary{background:var(--primary);color:white}.btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px)}.btn-white{background:white;color:var(--primary)}.btn-light{background:#eef2ff;color:var(--primary)}.btn-plain{background:#f1f5f9;color:#475569}.btn-danger{background:#fff1f2;color:#be123c}.btn-small{padding:7px 10px;font-size:13px;border-radius:9px}.grid{display:grid;gap:18px}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--white);border:1px solid #e8ebf2;border-radius:20px;padding:22px;box-shadow:0 4px 16px #0f172a06}.stat-label{font-size:13px;color:var(--muted);font-weight:700}.stat-number{font-size:31px;font-weight:900;margin-top:5px;letter-spacing:-1px}.stat-note{font-size:12px;color:#94a3b8;margin-top:3px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 14px}.section-title h2{margin:0;font-size:20px}.muted{color:var(--muted)}.small{font-size:13px}.quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.action-card{display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;color:var(--ink)}.action-card:hover{border-color:#a5b4fc;box-shadow:0 8px 20px #4f46e511}.action-icon{font-size:25px;background:#eef2ff;border-radius:13px;padding:10px}.action-card strong{display:block}.action-card span{font-size:12px;color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.field{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:11px;background:#fff;color:var(--ink)}.toolbar .field{flex:1;min-width:160px}.sentence-list{display:grid;gap:13px}.sentence-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px 20px}.sentence-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.badge{display:inline-flex;padding:4px 9px;border-radius:100px;background:#eef2ff;color:#4f46e5;font-size:11px;font-weight:900}.badge.easy{background:#d1fae5;color:#047857}.badge.medium{background:#fef3c7;color:#b45309}.badge.hard{background:#ffe4e6;color:#be123c}.sentence-en{font-size:18px;font-weight:850;margin:5px 0}.sentence-ko{color:#475569;margin:4px 0 9px}.memo{background:#f8fafc;color:#64748b;border-radius:9px;padding:8px 10px;font-size:12px}.card-bottom{border-top:1px solid #f1f5f9;margin-top:14px;padding-top:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.actions{display:flex;gap:7px}.empty{text-align:center;color:#94a3b8;background:white;border:1px dashed #cbd5e1;padding:45px 18px;border-radius:18px}.empty .emoji{font-size:38px;margin-bottom:8px}.form-card{max-width:720px;margin:auto}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.form-group{display:flex;flex-direction:column;gap:7px}.form-group label{font-size:13px;font-weight:800;color:#475569}.form-group.full{grid-column:1/-1}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.check-row{display:flex;align-items:center;gap:8px}.check-row input{width:18px;height:18px}.setup-options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{padding:15px;border:1px solid var(--line);border-radius:13px;background:#fff;text-align:left}.choice.selected{border:2px solid var(--primary);background:#eef2ff;color:var(--primary)}.choice strong{display:block}.choice span{font-size:12px;color:var(--muted)}.study-card{max-width:780px;margin:auto;text-align:center;padding:clamp(22px,5vw,45px)}.progress{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:18px 0 28px}.progress>div{height:100%;background:linear-gradient(90deg,#6366f1,#a5b4fc);width:0;transition:width .2s}.study-meaning{font-size:14px;color:var(--muted);margin-bottom:8px}.study-prompt{font-size:clamp(23px,4vw,32px);font-weight:900;margin:12px 0 22px;word-break:keep-all}.word-bank{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;min-height:48px;margin:18px 0}.word-chip{background:#eef2ff;color:#4338ca;border:1px solid #c7d2fe;padding:9px 12px;border-radius:11px;font-weight:800}.word-chip:disabled{opacity:.35;cursor:default}.answer-area{min-height:55px;border:1px dashed #cbd5e1;border-radius:13px;padding:10px;display:flex;justify-content:center;align-items:center;gap:7px;flex-wrap:wrap}.answer-chip{background:#4338ca;color:white;padding:8px 10px;border-radius:9px}.feedback{padding:12px;border-radius:12px;margin:16px 0;font-weight:800}.feedback.correct{background:#d1fae5;color:#047857}.feedback.wrong{background:#ffe4e6;color:#be123c}.typing-answer{max-width:520px;margin:15px auto}.result-score{font-size:52px;font-weight:950;color:var(--primary)}.bar-row{display:grid;grid-template-columns:120px 1fr 50px;gap:12px;align-items:center;margin:12px 0;font-size:13px}.bar{height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar div{height:100%;background:#6366f1}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:20;background:#172033;color:white;padding:12px 18px;border-radius:12px;box-shadow:0 10px 25px #0002;max-width:90vw}.hidden{display:none!important}.footer{text-align:center;color:#94a3b8;font-size:12px;padding:25px 0 10px}.mobile-nav{display:none}
    @media(max-width:760px){.top-inner{padding:12px 15px;flex-wrap:wrap;gap:9px}.brand{font-size:18px}.nav{width:100%;order:3;justify-content:space-between}.nav button{padding:8px 9px;font-size:13px}.container{padding:20px 14px 100px}.hero{padding:22px;border-radius:19px}.hero .hero-mark{font-size:43px}.grid-4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:16px}.stat-number{font-size:27px}.quick-actions{grid-template-columns:1fr}.action-card{padding:13px}.grid-2{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-group.full{grid-column:auto}.setup-options{grid-template-columns:1fr}.sentence-card{padding:15px}.sentence-en{font-size:16px}.bar-row{grid-template-columns:85px 1fr 38px;gap:7px}.section-title{margin-top:22px}.hero .btn{white-space:nowrap}.card-bottom{align-items:flex-start}.top-inner>.btn{display:none}}
    @media(max-width:380px){.grid-4{grid-template-columns:1fr 1fr}.stat-number{font-size:24px}.hero .hero-mark{display:none}.nav button{font-size:12px;padding:7px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="top-inner">
      <div class="brand"><span class="logo">SF</span> SentenceFlow</div>
      <nav class="nav" aria-label="주요 메뉴">
        <button data-view="dashboard" class="active">대시보드</button>
        <button data-view="list">문장 목록</button>
        <button data-view="stats">학습 통계</button>
      </nav>
      <button class="btn btn-primary" id="headerStudy">학습 시작 →</button>
    </div>
  </header>
  <main class="container">
    <div id="app"></div>
    <footer class="footer">© 2026 SentenceFlow · 나만의 영어 문장 학습 공간</footer>
  </main>
  <div id="toast" class="toast hidden" role="status"></div>
  <script>
    "use strict";

    // ==========================================
    // 기본 설정 및 예시 문장
    // ==========================================
    const STORAGE = {
      sentences: "sentenceflow_v1_sentences",
      records: "sentenceflow_v1_records",
      sessions: "sentenceflow_v1_sessions"
    };

    const SAMPLE_SENTENCES = [
      {englishText:"I want to learn English.",koreanMeaning:"나는 영어를 배우고 싶다.",category:"기초",difficulty:"Easy",memo:"가장 기본적인 소망 표현",isFavorite:true},
      {englishText:"I usually wake up early.",koreanMeaning:"나는 보통 일찍 일어난다.",category:"일상",difficulty:"Easy",memo:"습관을 나타내는 빈도부사 usually",isFavorite:false},
      {englishText:"Could you help me with this?",koreanMeaning:"이것 좀 도와주실 수 있나요?",category:"비즈니스/여행",difficulty:"Medium",memo:"공손한 요청 표현",isFavorite:true},
      {englishText:"I have been studying English for two years.",koreanMeaning:"나는 2년 동안 영어를 공부해 왔다.",category:"학습",difficulty:"Hard",memo:"현재완료진행형 (have been + -ing)",isFavorite:false},
      {englishText:"If I have time, I will call you.",koreanMeaning:"시간이 있으면 너에게 전화할게.",category:"기초",difficulty:"Medium",memo:"조건을 나타내는 문장",isFavorite:false},
      {englishText:"Practice makes perfect.",koreanMeaning:"연습이 완벽을 만든다.",category:"명언",difficulty:"Easy",memo:"꾸준한 연습의 중요성",isFavorite:true},
      {englishText:"The world is full of opportunities.",koreanMeaning:"세상은 기회로 가득하다.",category:"명언",difficulty:"Medium",memo:"be full of: ~로 가득하다",isFavorite:false}
    ];

    const readStore = (key, fallback) => {
      try { const value = localStorage.getItem(key); return value ? JSON.parse(value) : fallback; }
      catch (error) { console.warn("저장된 데이터를 읽지 못했습니다.", error); return fallback; }
    };
    const now = () => Date.now();
    const uid = prefix => prefix + "-" + now() + "-" + Math.random().toString(36).slice(2,8);
    let sentences = readStore(STORAGE.sentences, null);
    let records = readStore(STORAGE.records, []);
    let sessions = readStore(STORAGE.sessions, []);
    if (!Array.isArray(sentences)) {
      sentences = SAMPLE_SENTENCES.map((s,i)=>({...s,id:uid("sample"),createdAt:now()-i*1000,updatedAt:now(),studyCount:0,correctCount:0}));
      persist();
    }
    let currentView = "dashboard";
    let editingId = null;
    let searchText = "";
    let categoryFilter = "all";
    let difficultyFilter = "all";
    let favoriteOnly = false;
    let formData = null;
    let studyConfig = {mode:"word-arrange",count:10,order:"sequential",scope:"all"};
    let studyQueue = [];
    let studyIndex = 0;
    let studyAnswers = [];
    let selectedWords = [];
    let availableWords = [];
    let studyStart = 0;
    let answerChecked = false;
    let sessionCorrect = 0;
    let sessionFirstTryCorrect = 0;
    let sessionIncorrectIds = [];
    let toastTimer = null;

    function persist(){
      try {
        localStorage.setItem(STORAGE.sentences, JSON.stringify(sentences));
        localStorage.setItem(STORAGE.records, JSON.stringify(records));
        localStorage.setItem(STORAGE.sessions, JSON.stringify(sessions));
      } catch(e) { console.error(e); showToast("브라우저 저장 공간에 저장하지 못했습니다."); }
    }
    function esc(value="") {
      return String(value).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
    }
    function showToast(message) {
      const el = document.getElementById("toast");
      el.textContent = message; el.classList.remove("hidden");
      clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.add("hidden"),2800);
    }
    function setView(view) {
      currentView = view;
      document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
      render();
      window.scrollTo({top:0,behavior:"smooth"});
    }
    function accuracy(s) { return s.studyCount ? Math.round(s.correctCount/s.studyCount*100) : 0; }
    function totalAccuracy() {
      const total = sentences.reduce((sum,s)=>sum+s.studyCount,0);
      const correct = sentences.reduce((sum,s)=>sum+s.correctCount,0);
      return total ? Math.round(correct/total*100) : 0;
    }
    function formatDate(value) {
      if (!value) return "-";
      return new Date(value).toLocaleDateString("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit"});
    }
    function difficultyBadge(level) {
      const cls = level==="Easy"?"easy":level==="Medium"?"medium":"hard";
      const label = level==="Easy"?"쉬움":level==="Medium"?"보통":"어려움";
      return `<span class="badge ${cls}">${label}</span>`;
    }
    function render() {
      const app = document.getElementById("app");
      if (currentView==="dashboard") app.innerHTML = renderDashboard();
      else if (currentView==="list") app.innerHTML = renderList();
      else if (currentView==="form") app.innerHTML = renderForm();
      else if (currentView==="study-setup") app.innerHTML = renderStudySetup();
      else if (currentView==="study") app.innerHTML = renderStudy();
      else if (currentView==="result") app.innerHTML = renderResult();
      else if (currentView==="stats") app.innerHTML = renderStats();
      bindLocalEvents();
    }

    // ==========================================
    // 대시보드
    // ==========================================
    function renderDashboard() {
      const studied = sentences.reduce((n,s)=>n+s.studyCount,0);
      const favs = sentences.filter(s=>s.isFavorite).length;
      const recent = [...sentences].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).slice(0,3);
      return `
        <section class="hero">
          <div><h1>영어 문장, 내 것으로 만들기</h1><p>매일 조금씩 학습하고, 반복해서 완벽하게 기억해 보세요.</p><div style="margin-top:20px"><button class="btn btn-white" data-action="start-study">오늘의 학습 시작 →</button></div></div>
          <div class="hero-mark" aria-hidden="true">✦</div>
        </section>
        <section class="grid grid-4">
          <div class="card"><div class="stat-label">등록 문장</div><div class="stat-number">${sentences.length}</div><div class="stat-note">나만의 문장 모음</div></div>
          <div class="card"><div class="stat-label">누적 학습</div><div class="stat-number">${studied}</div><div class="stat-note">문장 학습 횟수</div></div>
          <div class="card"><div class="stat-label">전체 정답률</div><div class="stat-number">${totalAccuracy()}<span style="font-size:17px">%</span></div><div class="stat-note">지금까지의 학습 기록</div></div>
          <div class="card"><div class="stat-label">즐겨찾기</div><div class="stat-number">${favs}</div><div class="stat-note">중요한 문장 모아보기</div></div>
        </section>
        <div class="section-title"><h2>빠른 메뉴</h2></div>
        <section class="quick-actions">
          <button class="action-card" data-action="start-study"><span class="action-icon">🎯</span><span><strong>집중 학습</strong><span>문장 암기와 타이핑 연습</span></span></button>
          <button class="action-card" data-action="new-sentence"><span class="action-icon">✍️</span><span><strong>문장 추가</strong><span>새로운 영어 문장 등록하기</span></span></button>
          <button class="action-card" data-action="favorites"><span class="action-icon">⭐</span><span><strong>즐겨찾기</strong><span>중요한 문장만 모아서 보기</span></span></button>
        </section>
        <div class="section-title"><h2>최근 등록한 문장</h2><button class="btn btn-light btn-small" data-action="go-list">전체 보기 →</button></div>
        ${recent.length?`<div class="sentence-list">${recent.map(s=>sentenceCard(s,false)).join("")}</div>`:`<div class="empty"><div class="emoji">📘</div>아직 문장이 없습니다. 첫 문장을 등록해 보세요.</div>`}`;
    }

    // ==========================================
    // 문장 목록 및 등록/수정
    // ==========================================
    function sentenceCard(s, withActions=true) {
      return `<article class="sentence-card">
        <div class="sentence-top"><div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap"><span class="badge">${esc(s.category||"기타")}</span>${difficultyBadge(s.difficulty||"Easy")}</div>
        <button class="btn btn-plain btn-small" data-action="favorite" data-id="${esc(s.id)}" aria-label="즐겨찾기">${s.isFavorite?"⭐":"☆"}</button></div>
        <p class="sentence-en">${esc(s.englishText)}</p><p class="sentence-ko">${esc(s.koreanMeaning||"뜻이 등록되지 않았습니다.")}</p>
        ${s.memo?`<div class="memo">메모: ${esc(s.memo)}</div>`:""}
        <div class="card-bottom"><div class="small muted">학습 ${s.studyCount||0}회 · 정답률 <strong>${accuracy(s)}%</strong></div>
        ${withActions?`<div class="actions"><button class="btn btn-plain btn-small" data-action="edit" data-id="${esc(s.id)}">수정</button><button class="btn btn-danger btn-small" data-action="delete" data-id="${esc(s.id)}">삭제</button></div>`:""}</div>
      </article>`;
    }
    function renderList() {
      const categories = [...new Set(sentences.map(s=>s.category||"기타"))].sort();
      let filtered = sentences.filter(s=>{
        const text = (s.englishText+" "+s.koreanMeaning+" "+s.memo+" "+s.category).toLowerCase();
        return (!searchText||text.includes(searchText.toLowerCase())) &&
          (categoryFilter==="all"||s.category===categoryFilter) &&
          (difficultyFilter==="all"||s.difficulty===difficultyFilter) &&
          (!favoriteOnly||s.isFavorite);
      }).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      return `<div class="section-title" style="margin-top:0"><div><h2>내 문장 목록</h2><p class="muted small">등록한 문장을 검색하고 관리하세요.</p></div><button class="btn btn-primary" data-action="new-sentence">＋ 문장 추가</button></div>
        <div class="toolbar"><input class="field" id="searchInput" placeholder="영어, 뜻, 메모 검색..." value="${esc(searchText)}"><select class="field" id="categoryFilter" aria-label="카테고리 필터"><option value="all">모든 카테고리</option>${categories.map(c=>`<option value="${esc(c)}" ${categoryFilter===c?"selected":""}>${esc(c)}</option>`).join("")}</select>
        <select class="field" id="difficultyFilter" aria-label="난이도 필터"><option value="all">모든 난이도</option><option value="Easy" ${difficultyFilter==="Easy"?"selected":""}>쉬움</option><option value="Medium" ${difficultyFilter==="Medium"?"selected":""}>보통</option><option value="Hard" ${difficultyFilter==="Hard"?"selected":""}>어려움</option></select>
        <button class="btn ${favoriteOnly?"btn-primary":"btn-light"}" id="favoriteFilter">⭐ 즐겨찾기만</button></div>
        <p class="small muted" style="margin:0 0 12px">${filtered.length}개 문장</p>
        ${filtered.length?`<div class="sentence-list">${filtered.map(s=>sentenceCard(s,true)).join("")}</div>`:`<div class="empty"><div class="emoji">🔎</div>조건에 맞는 문장이 없습니다.<br><button class="btn btn-light" style="margin-top:12px" data-action="new-sentence">문장 추가하기</button></div>`}
        <div class="section-title"><h2>데이터 백업</h2></div><div class="card"><p class="small muted">문장과 학습 기록을 JSON 파일로 저장하거나, 이전 백업 파일을 불러올 수 있습니다.</p><div class="actions" style="flex-wrap:wrap"><button class="btn btn-light" data-action="export">JSON 백업 다운로드</button><button class="btn btn-plain" data-action="import">백업 파일 불러오기</button><input type="file" id="importFile" accept=".json,application/json" class="hidden"></div></div>`;
    }
    function renderForm() {
      const s = editingId?sentences.find(x=>x.id===editingId):null;
      const d = formData || (s?{...s}:{englishText:"",koreanMeaning:"",category:"기초",difficulty:"Easy",memo:"",isFavorite:false});
      return `<section class="card form-card"><div class="section-title" style="margin:0 0 20px"><div><h2>${s?"문장 수정":"새 문장 등록"}</h2><p class="small muted">영어 문장과 뜻을 입력해 학습 목록을 만들어 보세요.</p></div></div>
        <form id="sentenceForm"><div class="form-grid">
          <div class="form-group full"><label for="englishText">영어 문장 *</label><textarea class="field" id="englishText" rows="3" required placeholder="예: I want to learn English.">${esc(d.englishText)}</textarea></div>
          <div class="form-group full"><label for="koreanMeaning">한국어 뜻</label><textarea class="field" id="koreanMeaning" rows="2" placeholder="문장의 의미를 입력하세요.">${esc(d.koreanMeaning)}</textarea></div>
          <div class="form-group"><label for="category">카테고리</label><input class="field" id="category" value="${esc(d.category)}" placeholder="예: 기초, 일상, 여행"></div>
          <div class="form-group"><label for="difficulty">난이도</label><select class="field" id="difficulty"><option value="Easy" ${d.difficulty==="Easy"?"selected":""}>쉬움</option><option value="Medium" ${d.difficulty==="Medium"?"selected":""}>보통</option><option value="Hard" ${d.difficulty==="Hard"?"selected":""}>어려움</option></select></div>
          <div class="form-group full"><label for="memo">메모 / 문법 포인트</label><textarea class="field" id="memo" rows="2" placeholder="기억할 문법이나 표현을 적어 보세요.">${esc(d.memo)}</textarea></div>
          <div class="form-group full"><label class="check-row"><input type="checkbox" id="isFavorite" ${d.isFavorite?"checked":""}> 즐겨찾기에 추가</label></div>
        </div><div class="form-actions"><button type="button" class="btn btn-plain" data-action="cancel-form">취소</button><button class="btn btn-primary" type="submit">저장하기</button></div></form></section>`;
    }

    // ==========================================
    // 학습 설정 / 학습 실행
    // ==========================================
    function renderStudySetup() {
      return `<section class="card form-card"><h2 style="margin-top:0">학습 설정</h2><p class="muted small">원하는 학습 방식과 문장 범위를 선택하세요.</p>
        <h3>1. 학습 방식</h3><div class="setup-options">
          <button class="choice ${studyConfig.mode==="word-arrange"?"selected":""}" data-mode="word-arrange"><strong>🧩 단어 배열</strong><span>단어를 올바른 순서로 배열</span></button>
          <button class="choice ${studyConfig.mode==="typing"?"selected":""}" data-mode="typing"><strong>⌨️ 받아쓰기</strong><span>영어 문장을 직접 입력</span></button>
          <button class="choice ${studyConfig.mode==="mixed"?"selected":""}" data-mode="mixed"><strong>🎲 혼합 학습</strong><span>두 방식을 섞어서 학습</span></button>
        </div>
        <h3>2. 문장 범위</h3><div class="setup-options">
          <button class="choice ${studyConfig.scope==="all"?"selected":""}" data-scope="all"><strong>전체 문장</strong><span>${sentences.length}개 중 선택</span></button>
          <button class="choice ${studyConfig.scope==="favorites"?"selected":""}" data-scope="favorites"><strong>⭐ 즐겨찾기</strong><span>${sentences.filter(s=>s.isFavorite).length}개 문장</span></button>
          <button class="choice ${studyConfig.scope==="incorrect"?"selected":""}" data-scope="incorrect"><strong>🔁 취약 문장</strong><span>학습 기록에서 복습</span></button>
        </div>
        <h3>3. 문장 수</h3><div class="form-group"><select class="field" id="studyCount"><option value="5" ${studyConfig.count===5?"selected":""}>5문장</option><option value="10" ${studyConfig.count===10?"selected":""}>10문장</option><option value="20" ${studyConfig.count===20?"selected":""}>20문장</option><option value="all" ${studyConfig.count==="all"?"selected":""}>가능한 모든 문장</option></select></div>
        <h3>4. 순서</h3><div class="form-group"><select class="field" id="studyOrder"><option value="sequential" ${studyConfig.order==="sequential"?"selected":""}>등록 순서</option><option value="random" ${studyConfig.order==="random"?"selected":""}>무작위</option><option value="incorrect-first" ${studyConfig.order==="incorrect-first"?"selected":""}>정답률이 낮은 문장 먼저</option></select></div>
        <div class="form-actions"><button class="btn btn-plain" data-action="go-dashboard">취소</button><button class="btn btn-primary" data-action="begin-study">학습 시작 →</button></div></section>`;
    }
    function startStudy() {
      let pool = sentences.filter(s=>studyConfig.scope!=="favorites"||s.isFavorite);
      if (studyConfig.scope==="incorrect") pool = pool.filter(s=>s.studyCount>0&&accuracy(s)<100);
      if (!pool.length) { showToast("이 범위에 학습할 문장이 없습니다."); return; }
      if (studyConfig.order==="random") pool.sort(()=>Math.random()-.5);
      if (studyConfig.order==="incorrect-first") pool.sort((a,b)=>accuracy(a)-accuracy(b));
      const count = studyConfig.count==="all"?pool.length:Number(studyConfig.count);
      studyQueue = pool.slice(0,count);
      if (studyConfig.mode==="mixed") studyQueue=studyQueue.map((s,i)=>({...s,_mode:i%2===0?"word-arrange":"typing"}));
      studyIndex=0;studyAnswers=[];selectedWords=[];availableWords=[];answerChecked=false;
      sessionCorrect=0;sessionFirstTryCorrect=0;sessionIncorrectIds=[];studyStart=now();
      setView("study");
    }
    function activeMode() {
      return studyQueue[studyIndex]? (studyQueue[studyIndex]._mode||studyConfig.mode) : studyConfig.mode;
    }
    function shuffledWords(text) {
      const words=text.trim().split(/\s+/).map((word,i)=>({id:String(i)+"-"+Math.random().toString(36).slice(2,6),text:word}));
      for(let i=words.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[words[i],words[j]]=[words[j],words[i]];}
      return words;
    }
    function ensureWordState() {
      if(activeMode()==="word-arrange" && availableWords.length===0 && selectedWords.length===0 && !answerChecked) availableWords=shuffledWords(studyQueue[studyIndex].englishText);
    }
    function renderStudy() {
      if(studyIndex>=studyQueue.length) return renderResult();
      const s=studyQueue[studyIndex]; const mode=activeMode(); ensureWordState();
      const pct=Math.round(studyIndex/studyQueue.length*100);
      return `<section class="card study-card"><div style="display:flex;justify-content:space-between;gap:10px" class="small muted"><span>진행 ${studyIndex+1} / ${studyQueue.length}</span><span>${mode==="typing"?"⌨️ 받아쓰기":"🧩 단어 배열"}</span></div>
        <div class="progress"><div style="width:${pct}%"></div></div><div class="study-meaning">${esc(s.category||"")} · 한국어 뜻</div><div class="study-prompt">${esc(s.koreanMeaning||"영어 문장을 완성하세요.")}</div>
        ${mode==="word-arrange"?`<p class="small muted">아래 단어를 눌러 올바른 순서로 배열하세요.</p><div class="answer-area" id="answerArea">${selectedWords.map(w=>`<button class="answer-chip" data-word-remove="${esc(w.id)}">${esc(w.text)}</button>`).join("")||`<span class="small muted">선택한 단어가 여기에 표시됩니다.</span>`}</div><div class="word-bank">${availableWords.map(w=>`<button class="word-chip" data-word-add="${esc(w.id)}">${esc(w.text)}</button>`).join("")}</div>`
        :`<p class="small muted">영어 문장을 직접 입력하세요.</p><div class="typing-answer"><input id="typingInput" class="field" autocomplete="off" placeholder="영어 문장 입력..." ${answerChecked?"disabled":""}></div>`}
        ${answerChecked?`<div class="feedback ${studyAnswers[studyIndex].isCorrect?"correct":"wrong"}">${studyAnswers[studyIndex].isCorrect?"정답입니다! 🎉":"아쉽지만 정답은 아래와 같습니다."}<br><span style="display:block;margin-top:5px">${esc(s.englishText)}</span></div>`:""}
        <div class="actions" style="justify-content:center;margin-top:18px">${!answerChecked?`<button class="btn btn-plain" data-action="quit-study">학습 종료</button><button class="btn btn-primary" data-action="check-answer">정답 확인</button>`:`<button class="btn btn-primary" data-action="next-question">${studyIndex===studyQueue.length-1?"결과 보기":"다음 문장 →"}</button>`}</div></section>`;
    }
    function checkAnswer() {
      if(answerChecked) return;
      const s=studyQueue[studyIndex];const mode=activeMode();
      let answer=mode==="typing"?(document.getElementById("typingInput")?.value||""):selectedWords.map(w=>w.text).join(" ");
      if(!answer.trim()){showToast(mode==="typing"?"영어 문장을 입력해 주세요.":"단어를 선택해 주세요.");return;}
      const normalize=t=>t.trim().toLowerCase().replace(/[.,!?;:'"()]/g,"").replace(/\s+/g," ");
      const correct=normalize(answer)===normalize(s.englishText);
      studyAnswers[studyIndex]={sentenceId:s.id,userAnswer:answer,isCorrect:correct,mode};
      if(correct){sessionCorrect++;sessionFirstTryCorrect++}else if(!sessionIncorrectIds.includes(s.id)){sessionIncorrectIds.push(s.id)}
      s.studyCount=(s.studyCount||0)+1;if(correct)s.correctCount=(s.correctCount||0)+1;s.lastStudiedAt=now();
      records.push({id:uid("record"),sentenceId:s.id,mode,userAnswer:answer,isCorrect:correct,attemptCount:1,studiedAt:now(),duration:Math.round((now()-studyStart)/1000)});
      answerChecked=true;persist();render();
    }
    function nextQuestion() {
      studyIndex++;selectedWords=[];availableWords=[];answerChecked=false;studyStart=now();
      if(studyIndex>=studyQueue.length){finishSession();setView("result")}else render();
    }
    function finishSession() {
      sessions.push({id:uid("session"),mode:studyConfig.mode,totalQuestions:studyAnswers.length,correctCount:studyAnswers.filter(a=>a&&a.isCorrect).length,incorrectCount:studyAnswers.filter(a=>a&&!a.isCorrect).length,firstTryCorrectCount:sessionFirstTryCorrect,startedAt:studyStart,completedAt:now(),incorrectSentenceIds:sessionIncorrectIds});
      persist();
    }
    function renderResult() {
      const total=studyAnswers.filter(Boolean).length;const correct=studyAnswers.filter(a=>a&&a.isCorrect).length;const pct=total?Math.round(correct/total*100):0;
      return `<section class="card study-card"><div style="font-size:48px">🏆</div><h2>학습 완료!</h2><p class="muted">오늘도 한 걸음 성장했어요.</p><div class="result-score">${pct}%</div><p>정답 ${correct}개 · 오답 ${total-correct}개 · 총 ${total}문장</p><div class="progress"><div style="width:${pct}%"></div></div>
        ${total-correct?`<div style="text-align:left;margin:20px 0"><h3>다시 복습할 문장</h3>${studyAnswers.map((a,i)=>a&&!a.isCorrect?`<div class="sentence-card" style="margin:8px 0"><strong>${esc(studyQueue[i].englishText)}</strong><div class="small muted">${esc(studyQueue[i].koreanMeaning)}</div></div>`:"").join("")}</div>`:"<p class='feedback correct'>모든 문장을 맞혔어요. 훌륭합니다!</p>"}
        <div class="actions" style="justify-content:center;flex-wrap:wrap"><button class="btn btn-light" data-action="start-study">한 번 더 학습</button><button class="btn btn-primary" data-action="go-dashboard">대시보드로</button></div></section>`;
    }

    // ==========================================
    // 학습 통계
    // ==========================================
    function renderStats() {
      const totalAttempts=sentences.reduce((n,s)=>n+s.studyCount,0);
      const correct=sentences.reduce((n,s)=>n+s.correctCount,0);
      const missed=[...sentences].filter(s=>s.studyCount>0).sort((a,b)=>accuracy(a)-accuracy(b)).slice(0,5);
      const mostStudied=[...sentences].sort((a,b)=>(b.studyCount||0)-(a.studyCount||0)).slice(0,5);
      return `<div class="section-title" style="margin-top:0"><div><h2>학습 통계</h2><p class="small muted">나의 학습 기록을 한눈에 확인하세요.</p></div></div>
        <div class="grid grid-4"><div class="card"><div class="stat-label">등록 문장</div><div class="stat-number">${sentences.length}</div></div><div class="card"><div class="stat-label">총 학습 횟수</div><div class="stat-number">${totalAttempts}</div></div><div class="card"><div class="stat-label">맞힌 횟수</div><div class="stat-number">${correct}</div></div><div class="card"><div class="stat-label">전체 정답률</div><div class="stat-number">${totalAccuracy()}%</div></div></div>
        <div class="grid grid-2" style="margin-top:18px"><section class="card"><h2 style="margin-top:0;font-size:18px">자주 틀리는 취약 문장 Top 5</h2>${missed.length?missed.map(s=>`<div style="padding:12px 0;border-bottom:1px solid #f1f5f9"><div style="font-weight:800;font-size:14px">${esc(s.englishText)}</div><div class="small muted">${esc(s.koreanMeaning)}</div><div class="bar-row"><span>정답률</span><div class="bar"><div style="width:${accuracy(s)}%"></div></div><strong>${accuracy(s)}%</strong></div></div>`).join(""):`<div class="empty">아직 학습 기록이 충분하지 않습니다.</div>`}</section>
        <section class="card"><h2 style="margin-top:0;font-size:18px">가장 많이 학습한 문장</h2>${mostStudied.length?mostStudied.map(s=>`<div style="padding:12px 0;border-bottom:1px solid #f1f5f9"><div style="font-weight:800;font-size:14px">${esc(s.englishText)}</div><div class="small muted">${esc(s.koreanMeaning)}</div><div class="small" style="margin-top:5px">학습 ${s.studyCount||0}회 · 정답률 ${accuracy(s)}%</div></div>`).join(""):`<div class="empty">등록한 문장이 없습니다.</div>`}</section></div>
        <div class="section-title"><h2>학습 기록</h2></div><div class="card"><p class="muted small">완료한 학습 세션: <strong>${sessions.length}회</strong></p><p class="muted small">최근 학습: <strong>${sessions.length?formatDate(sessions[sessions.length-1].completedAt):"기록 없음"}</strong></p></div>`;
    }

    // ==========================================
    // 이벤트 연결
    // ==========================================
    function bindLocalEvents() {
      const form=document.getElementById("sentenceForm");
      if(form) form.addEventListener("submit",e=>{
        e.preventDefault();
        const englishText=document.getElementById("englishText").value.trim();
        if(!englishText){showToast("영어 문장을 입력해 주세요.");return}
        const data={englishText,koreanMeaning:document.getElementById("koreanMeaning").value.trim(),category:document.getElementById("category").value.trim()||"기타",difficulty:document.getElementById("difficulty").value,memo:document.getElementById("memo").value.trim(),isFavorite:document.getElementById("isFavorite").checked};
        if(editingId){const s=sentences.find(x=>x.id===editingId);if(s)Object.assign(s,data,{updatedAt:now()});showToast("문장을 수정했습니다.")}else{sentences.unshift({...data,id:uid("sentence"),createdAt:now(),updatedAt:now(),studyCount:0,correctCount:0});showToast("새 문장을 등록했습니다.")}
        editingId=null;formData=null;persist();setView("list");
      });
      const search=document.getElementById("searchInput");
      if(search) search.addEventListener("input",e=>{searchText=e.target.value;const pos=e.target.selectionStart;render();const next=document.getElementById("searchInput");next.focus();next.setSelectionRange(pos,pos)});
      const cat=document.getElementById("categoryFilter");if(cat)cat.addEventListener("change",e=>{categoryFilter=e.target.value;render()});
      const diff=document.getElementById("difficultyFilter");if(diff)diff.addEventListener("change",e=>{difficultyFilter=e.target.value;render()});
      const fav=document.getElementById("favoriteFilter");if(fav)fav.addEventListener("click",()=>{favoriteOnly=!favoriteOnly;render()});
      const count=document.getElementById("studyCount");if(count)count.addEventListener("change",e=>{studyConfig.count=e.target.value==="all"?"all":Number(e.target.value)});
      const order=document.getElementById("studyOrder");if(order)order.addEventListener("change",e=>studyConfig.order=e.target.value);
      const typing=document.getElementById("typingInput");if(typing&&!answerChecked)typing.addEventListener("keydown",e=>{if(e.key==="Enter")checkAnswer()});
      const importFile=document.getElementById("importFile");if(importFile)importFile.addEventListener("change",handleImportFile);
    }
    function handleAction(button) {
      const action=button.dataset.action;const id=button.dataset.id;
      if(action==="start-study")setView("study-setup");
      else if(action==="new-sentence"){editingId=null;formData=null;setView("form")}
      else if(action==="go-list")setView("list");
      else if(action==="go-dashboard")setView("dashboard");
      else if(action==="cancel-form"){editingId=null;formData=null;setView("list")}
      else if(action==="favorites"){favoriteOnly=true;setView("list")}
      else if(action==="edit"){editingId=id;formData=null;setView("form")}
      else if(action==="favorite"){const s=sentences.find(x=>x.id===id);if(s)s.isFavorite=!s.isFavorite;persist();render()}
      else if(action==="delete"){const s=sentences.find(x=>x.id===id);if(s&&confirm(`"${s.englishText}" 문장을 삭제할까요?`)){sentences=sentences.filter(x=>x.id!==id);records=records.filter(r=>r.sentenceId!==id);persist();showToast("문장을 삭제했습니다.");render()}}
      else if(action==="begin-study")startStudy();
      else if(action==="check-answer")checkAnswer();
      else if(action==="next-question")nextQuestion();
      else if(action==="quit-study"){if(confirm("학습을 종료할까요? 지금까지의 답안은 세션 결과에 저장되지 않습니다."))setView("dashboard")}
      else if(action==="export")exportData();
      else if(action==="import")document.getElementById("importFile")?.click();
    }
    document.addEventListener("click",e=>{
      const actionButton=e.target.closest("[data-action]");
      if(actionButton){handleAction(actionButton);return}
      const nav=e.target.closest("[data-view]");
      if(nav){setView(nav.dataset.view);return}
      const mode=e.target.closest("[data-mode]");
      if(mode){studyConfig.mode=mode.dataset.mode;render();return}
      const scope=e.target.closest("[data-scope]");
      if(scope){studyConfig.scope=scope.dataset.scope;render();return}
      const add=e.target.closest("[data-word-add]");
      if(add&&!answerChecked){const index=availableWords.findIndex(w=>w.id===add.dataset.wordAdd);if(index>=0){selectedWords.push(availableWords.splice(index,1)[0]);render()}return}
      const remove=e.target.closest("[data-word-remove]");
      if(remove&&!answerChecked){const index=selectedWords.findIndex(w=>w.id===remove.dataset.wordRemove);if(index>=0){availableWords.push(selectedWords.splice(index,1)[0]);render()}return}
    });
    document.getElementById("headerStudy").addEventListener("click",()=>setView("study-setup"));

    function exportData() {
      const data={app:"SentenceFlow",version:1,exportedAt:new Date().toISOString(),sentences,records,sessions};
      const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
      const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="sentenceflow-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();URL.revokeObjectURL(url);showToast("백업 파일을 다운로드했습니다.");
    }
    function handleImportFile(e) {
      const file=e.target.files&&e.target.files[0];if(!file)return;
      const reader=new FileReader();
      reader.onload=()=>{
        try {
          const data=JSON.parse(reader.result);
          if(!Array.isArray(data.sentences))throw new Error("sentences 배열이 없습니다.");
          if(!confirm("현재 문장과 학습 기록을 백업 파일의 데이터로 교체할까요?"))return;
          sentences=data.sentences;records=Array.isArray(data.records)?data.records:[];sessions=Array.isArray(data.sessions)?data.sessions:[];
          persist();showToast("백업 데이터를 불러왔습니다.");setView("list");
        } catch(err){showToast("백업 파일 형식이 올바르지 않습니다.");}
        e.target.value="";
      };
      reader.readAsText(file);
    }

    // 첫 화면 표시
    render();
  </script>
</body>
</html>
